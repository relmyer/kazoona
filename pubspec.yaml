name: kazoona
description: "Kazoona - Scratch & Play with Friends!"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.2

  # UI & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Utils
  uuid: ^4.5.1
  shared_preferences: ^2.3.3

  # Image picker for profile photo
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
